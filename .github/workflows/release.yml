name: Release

# Builds melonDS for Windows/macOS/Linux and publishes them as downloadable
# assets on a GitHub Release whenever a version tag (v1.0.0 etc.) is pushed.
# Each binary has the repo's Mario Kart DS ROM compiled in (DS64_EMBED_ROM),
# so it runs without a separate .nds file. This is what lets someone install
# DS64 without building from source themselves — see the "Install a prebuilt
# release" section in README.md.
#
# Test builds: a tag with a "-" in it (v0.2.0-test1, v1.0.0-rc1, ...) makes a
# *draft* release instead — visible only to the repo's collaborators, not
# public, no notifications — so the binaries can be downloaded straight from
# the release page and tried before cutting a real tag. Delete the draft and
# the tag afterwards.
on:
  push:
    tags:
      - "v*"

env:
  DS64_SRC: vendor/melonDS-src
  # Required whenever -DMELONDS_EMBED_BUILD_INFO=ON is passed (every
  # build job below) — src/CMakeLists.txt hard-errors if any of these
  # three are empty.
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Self-contained AppImage (Qt + bundled Python + all DS64 Python deps),
      # built in a clean ubuntu:22.04 container — see the script's header.
      - name: Build the AppImage
        run: |
          mkdir -p dist
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            -e MELONDS_GIT_BRANCH -e MELONDS_GIT_HASH -e MELONDS_BUILD_PROVIDER \
            -v "$PWD":/src:ro -v "$PWD/dist":/out -v "$HOME/.cache/ds64-appimage":/cache ubuntu:22.04 \
            bash /src/packaging/linux/build-appimage.sh
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libfuse2 \
            libegl1 libgl1 libopengl0 libgbm1 libasound2 libfontconfig1 libfreetype6 libharfbuzz0b \
            libsm6 libice6 libx11-xcb1 libwayland-client0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 >/dev/null
          python3 packaging/smoke_test.py dist/DS64-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-linux-x86_64
          path: dist/DS64-x86_64.AppImage

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-15
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake autoconf-archive libtool python-setuptools
      - uses: lukka/get-cmake@latest
      # See build-macos.yml for why this is needed: Homebrew's python@3.x
      # on these (Apple Silicon) runners is arm64-only, which breaks
      # linking the embedded-Python symbols for an x86_64 build.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies for the bundle
        run: |
          ./packaging/macos/install-python-deps.sh \
            "${{ matrix.arch }}" \
            "${{ steps.setup-python.outputs.python-path }}" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ds64-site-packages"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
          restore-keys: vcpkg-${{ matrix.arch }}-osx-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
      - name: Configure
        working-directory: ${{ env.DS64_SRC }}
        run: >
          cmake --preset release-mac-${{ matrix.arch }}
          -DMELONDS_EMBED_BUILD_INFO=ON -DDS64_EMBED_ROM=ON -DVCPKG_ROOT="$VCPKG_ROOT"
          -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"
      - name: Build
        working-directory: ${{ env.DS64_SRC }}
        run: cmake --build --preset release-mac-${{ matrix.arch }}
      - name: Assemble standalone app bundle
        run: |
          ./packaging/macos/make-bundle.sh \
            "${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}/melonDS.app" \
            "$GITHUB_WORKSPACE" \
            "${{ steps.setup-python.outputs.python-path }}" \
            "$RUNNER_TEMP/ds64-site-packages"
      - name: Smoke-test the app bundle
        run: >
          "${{ steps.setup-python.outputs.python-path }}" packaging/smoke_test.py
          "${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}/melonDS.app"
      - name: Compress app bundle
        run: |
          cd ${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}
          zip -r -y "$GITHUB_WORKSPACE/DS64-macos-${{ matrix.arch }}.zip" melonDS.app
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-macos-${{ matrix.arch }}
          path: DS64-macos-${{ matrix.arch }}.zip

  build-windows:
    runs-on: windows-2025
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
          restore-keys: vcpkg-x86_64-windows-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
      - name: Configure
        working-directory: ${{ env.DS64_SRC }}
        shell: pwsh
        run: >
          cmake --preset release-windows-x86_64
          -DENABLE_DEBUG_DEPS=OFF -DMELONDS_EMBED_BUILD_INFO=ON
          -DUSE_CCACHE=OFF
          -DDS64_EMBED_ROM=ON
          -DVCPKG_ROOT="$env:VCPKG_ROOT"
          -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"
      - name: Build
        working-directory: ${{ env.DS64_SRC }}
        run: cmake --build --preset release-windows-x86_64
      - name: Package standalone bundle
        shell: pwsh
        run: |
          ./packaging/windows/make-bundle.ps1 `
            -Binary "${{ env.DS64_SRC }}\build\release-windows-x86_64\melonDS.exe" `
            -Python "${{ steps.setup-python.outputs.python-path }}" `
            -RepoRoot "${{ github.workspace }}" `
            -OutDir "${{ github.workspace }}\DS64-windows-x86_64"
          & "${{ steps.setup-python.outputs.python-path }}" packaging/smoke_test.py "${{ github.workspace }}\DS64-windows-x86_64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "DS64-windows-x86_64" -DestinationPath "DS64-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-windows-x86_64
          path: DS64-windows-x86_64.zip

  publish:
    needs: [build-ubuntu, build-macos, build-windows]
    # Each OS package is self-contained, so one platform failing must not
    # hold back the others: publish whatever built and passed its smoke
    # test. The release notes list any platform that is missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks
    # for more — without this, softprops/action-gh-release fails with
    # "Resource not accessible by integration" (403) trying to create
    # the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No platform built successfully; nothing to publish."
            exit 1
          fi
          {
            for asset in DS64-x86_64.AppImage DS64-macos-x86_64.zip DS64-macos-arm64.zip DS64-windows-x86_64.zip; do
              [ -f "release-assets/$asset" ] || echo "- ⚠️ \`$asset\` failed to build for this release."
            done
          } > missing.md
          cat missing.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: missing.md
          generate_release_notes: true
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
