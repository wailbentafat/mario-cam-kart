name: macOS

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

# A newer push to the same branch/PR supersedes the running build, instead
# of two identical runs competing for runners and the vcpkg cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  DS64_SRC: vendor/melonDS-src

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    name: ${{ matrix.arch }}
    runs-on: macos-15

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install dependencies for package building
        run: |
          brew install autoconf automake autoconf-archive libtool python-setuptools
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      # find_package(Python3) was picking up Homebrew's python@3.14,
      # which on these (Apple Silicon) runners is arm64-only — linking
      # that into an x86_64 build fails with "found architecture
      # 'arm64', required architecture 'x86_64'" on every embedded-
      # Python symbol (GestureController/PhoneController). python.org's
      # releases (what actions/setup-python installs on macOS) are
      # universal2 and link into either arch, so pin to one explicitly
      # and point cmake at it instead of letting it search PATH.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies for the bundle
        run: |
          ./packaging/macos/install-python-deps.sh \
            "${{ matrix.arch }}" \
            "${{ steps.setup-python.outputs.python-path }}" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ds64-site-packages"
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
          restore-keys: vcpkg-${{ matrix.arch }}-osx-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
      # CMakePresets.json must sit in the directory cmake is invoked from
      # (a lukka/run-cmake limitation, not just this repo's layout —
      # vcpkg.json's glob-based discovery doesn't have that restriction,
      # which is why only this step runs cmake directly instead of
      # through lukka/run-cmake).
      - name: Configure
        working-directory: ${{ env.DS64_SRC }}
        run: >
          cmake --preset release-mac-${{ matrix.arch }}
          -DMELONDS_EMBED_BUILD_INFO=ON
          -DDS64_EMBED_ROM=ON
          -DVCPKG_ROOT="$VCPKG_ROOT"
          -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"
      - name: Build
        working-directory: ${{ env.DS64_SRC }}
        run: cmake --build --preset release-mac-${{ matrix.arch }}
      - name: Assemble standalone app bundle
        run: |
          ./packaging/macos/make-bundle.sh \
            "${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}/melonDS.app" \
            "$GITHUB_WORKSPACE" \
            "${{ steps.setup-python.outputs.python-path }}" \
            "$RUNNER_TEMP/ds64-site-packages"
      - name: Smoke-test the app bundle
        run: >
          "${{ steps.setup-python.outputs.python-path }}" packaging/smoke_test.py
          "${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}/melonDS.app"
      - name: Compress app bundle
        shell: bash
        run: |
          cd ${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}
          zip -r -y "$GITHUB_WORKSPACE/macOS-${{ matrix.arch }}.zip" melonDS.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: macOS-${{ matrix.arch }}.zip
          retention-days: 1
      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
