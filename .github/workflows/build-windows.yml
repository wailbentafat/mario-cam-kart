name: Windows

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

# A newer push to the same branch/PR supersedes the running build, instead
# of two identical runs competing for runners and the vcpkg cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  DS64_SRC: vendor/melonDS-src

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v4
    - name: Set up CMake
      uses: lukka/get-cmake@latest
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
    # See build-macos.yml for why this runs cmake directly instead of
    # through lukka/run-cmake — CMakePresets.json must sit in the
    # directory cmake is invoked from, which the lukka action doesn't
    # support pointing at a subdirectory of the checked-out repo.
    - name: Configure
      working-directory: ${{ env.DS64_SRC }}
      shell: pwsh
      run: >
        cmake --preset release-windows-${{ matrix.arch.name }}
        -DENABLE_DEBUG_DEPS=OFF -DMELONDS_EMBED_BUILD_INFO=ON
        -DUSE_CCACHE=OFF
        -DDS64_EMBED_ROM=ON
        -DVCPKG_ROOT="$env:VCPKG_ROOT"
        -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"
    - name: Build
      working-directory: ${{ env.DS64_SRC }}
      run: cmake --build --preset release-windows-${{ matrix.arch.name }}
    - name: Package standalone bundle
      shell: pwsh
      run: |
        ./packaging/windows/make-bundle.ps1 `
          -Binary "${{ env.DS64_SRC }}\build\release-windows-${{ matrix.arch.name }}\melonDS.exe" `
          -Python "${{ steps.setup-python.outputs.python-path }}" `
          -RepoRoot "${{ github.workspace }}" `
          -OutDir "${{ github.workspace }}\DS64-windows-${{ matrix.arch.name }}"
        & "${{ steps.setup-python.outputs.python-path }}" packaging/smoke_test.py "${{ github.workspace }}\DS64-windows-${{ matrix.arch.name }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Compress-Archive -Path "DS64-windows-${{ matrix.arch.name }}" -DestinationPath "DS64-windows-${{ matrix.arch.name }}.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: DS64-windows-${{ matrix.arch.name }}
        path: DS64-windows-${{ matrix.arch.name }}.zip
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
