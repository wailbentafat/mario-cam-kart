<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>DS64 Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --neon-cyan: #39f5e2;
    --neon-magenta: #ff3ec8;
    --neon-yellow: #ffe14d;
    --neon-green: #4dff8f;
    --panel: #10152a;
    --panel-border: #2a3566;
    --text: #d8ddf5;
    --text-dim: #6c76a8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  body {
    background-image:
      linear-gradient(#121833 1px, transparent 1px),
      linear-gradient(90deg, #121833 1px, transparent 1px);
    background-size: 36px 36px;
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    z-index: 5;
  }
  #logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--neon-cyan), 0 0 18px rgba(57,245,226,0.5);
  }
  #logo span { color: var(--neon-magenta); text-shadow: 0 0 6px var(--neon-magenta), 0 0 18px rgba(255,62,200,0.5); }
  #status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #555; margin-right: 6px; vertical-align: middle;
  }
  #status-dot.live { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }

  /* ---------- connect screen ---------- */
  #connect {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; z-index: 10;
    background: var(--bg);
  }
  #connect-brand {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(28px, 10vw, 40px);
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--neon-cyan), 0 0 24px rgba(57,245,226,0.5);
  }
  #connect-brand span { color: var(--neon-magenta); text-shadow: 0 0 6px var(--neon-magenta), 0 0 24px rgba(255,62,200,0.5); }
  #connect-label { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
  #connect-status { font-size: 12px; color: var(--neon-yellow); letter-spacing: 1px; min-height: 16px; text-align: center; }
  #connect-status.err { color: var(--neon-magenta); }
  #addr {
    font-family: 'Space Mono', monospace;
    font-size: 15px; padding: 10px; width: 78%;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; color: var(--text); text-align: center;
  }
  #go {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px; padding: 16px 32px;
    background: var(--panel); color: var(--neon-yellow);
    border: 2px solid var(--neon-yellow); border-radius: 12px;
    box-shadow: 0 0 16px rgba(255,225,77,0.3);
  }
  #go:active { background: var(--neon-yellow); color: #10152a; }

  /* ---------- steer-mode select screen ---------- */
  #mode-select {
    display: none;
    position: fixed; inset: 0; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; z-index: 10;
    background: var(--bg);
    padding: 0 24px;
  }
  #mode-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px; color: var(--neon-cyan); letter-spacing: 1px;
    text-align: center; margin-bottom: 8px;
  }
  .mode-btn {
    width: 100%; max-width: 320px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px; letter-spacing: 1px;
    padding: 18px 14px;
    background: var(--panel); color: var(--text);
    border: 2px solid var(--panel-border); border-radius: 12px;
    text-align: center;
  }
  .mode-btn .mode-desc {
    display: block; margin-top: 6px;
    font-family: 'Space Mono', monospace; font-size: 10px;
    color: var(--text-dim); letter-spacing: 0;
    text-transform: none;
  }
  .mode-btn:active { transform: scale(0.97); }
  #mode-wheel { border-color: var(--neon-cyan); color: var(--neon-cyan); }
  #mode-buttons { border-color: var(--neon-magenta); color: var(--neon-magenta); }
  #mode-gyro { border-color: var(--neon-yellow); color: var(--neon-yellow); }

  /* ---------- settings gear + dropdown panel ---------- */
  #gear-btn {
    display: none;
    position: fixed; top: 8px; right: 12px; z-index: 7;
    width: 30px; height: 30px; border-radius: 50%;
    align-items: center; justify-content: center;
    font-size: 15px; color: var(--text-dim);
    border: 1px solid var(--panel-border); background: var(--panel);
  }
  #gear-btn:active { color: var(--neon-cyan); border-color: var(--neon-cyan); }

  #settings-panel {
    display: none;
    position: fixed; top: 44px; right: 12px; z-index: 7;
    flex-direction: column; gap: 10px;
    width: 220px; padding: 14px;
    background: var(--panel); border: 2px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .settings-row { display: flex; flex-direction: column; gap: 4px; }
  .settings-row label {
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .settings-row select {
    font-family: 'Space Mono', monospace; font-size: 13px;
    padding: 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 6px;
  }
  #full-picker-btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    padding: 10px 6px; letter-spacing: 1px;
    background: var(--bg); color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan); border-radius: 8px;
    text-align: center;
  }
  #full-picker-btn:active { background: var(--neon-cyan); color: #10152a; }

  /* ---------- pad ---------- */
  #pad {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    padding-top: 40px;
  }

  #wheel-zone {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 0 4px;
  }
  #wheel-row {
    display: flex; align-items: center; justify-content: center;
    gap: 18px;
  }
  /* L/R hold-to-steer buttons: a full-lock digital alternative next to
     the analog wheel drag, for players who find dragging the wheel
     fiddly — tap and hold instead of having to track a thumb position. */
  .steer-btn {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--neon-cyan);
    border: 3px solid var(--neon-cyan);
    background: var(--panel);
    box-shadow: 0 0 10px rgba(57,245,226,0.25);
    transition: transform 0.05s, box-shadow 0.1s, background 0.1s;
  }
  .steer-btn.active {
    background: var(--neon-cyan); color: #10152a;
    box-shadow: 0 0 24px rgba(57,245,226,0.8);
    transform: scale(0.92);
  }
  #wheel {
    width: 108px; height: 108px; border-radius: 50%;
    border: 3px solid var(--panel-border);
    position: relative;
    box-shadow: 0 0 0 1px rgba(57,245,226,0.1), inset 0 0 20px rgba(0,0,0,0.5);
    background: var(--panel);
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  #wheel.turning { border-color: var(--neon-cyan); box-shadow: 0 0 18px rgba(57,245,226,0.5); }
  #wheel-needle {
    position: absolute; top: 50%; left: 50%;
    width: 4px; height: 42px;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
    transform-origin: 50% 100%;
    margin-left: -2px; margin-top: -42px;
    border-radius: 2px;
    transition: transform 0.05s linear;
  }
  #wheel-dot {
    position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
    margin: -5px; border-radius: 50%; background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
  }
  #tilt-readout { font-size: 11px; color: var(--text-dim); margin-top: 10px; letter-spacing: 1px; }

  /* Only one steering input is ever active at a time (chosen on the
     mode-select screen) — the other two are fully hidden, not just
     visually dimmed, so their listeners never fight over the shared
     `steer` value (that silent three-way conflict was the actual cause
     of steering feeling stuck/biased before this mode picker existed). */
  #pad.mode-wheel .steer-btn { display: none; }
  #pad.mode-buttons #wheel { display: none; }
  #pad.mode-gyro #wheel { display: none; }
  #pad.mode-gyro .steer-btn { display: none; }
  #pad.mode-gyro #tilt-readout { font-size: 15px; color: var(--neon-yellow); margin-top: 14px; }

  /* ---------- shoulder row (DRIFT / ITEM) ---------- */
  #shoulders {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 18px;
    gap: 14px;
  }
  .shoulder {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    text-align: center;
    padding: 14px 0;
    border-radius: 10px;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  #sh-drift { flex: 1; color: var(--neon-magenta); border-color: rgba(255,62,200,0.4); }
  #sh-drift.active { background: var(--neon-magenta); color: #10152a; box-shadow: 0 0 20px rgba(255,62,200,0.6); }

  /* ITEM gets its own big, impossible-to-miss circular button (unlike
     DRIFT, this is the one players reach for in a split-second during a
     race) with a slow idle pulse so it draws the eye even when nothing's
     happening on screen. */
  #sh-item {
    flex: 0 0 auto;
    width: 92px; height: 92px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--neon-yellow); border: 3px solid var(--neon-yellow);
    background: var(--panel);
    box-shadow: 0 0 16px rgba(255,225,77,0.45);
    animation: item-pulse 1.6s ease-in-out infinite;
  }
  #sh-item .item-icon { font-size: 26px; line-height: 1; margin-bottom: 4px; }
  #sh-item.active {
    background: var(--neon-yellow); color: #10152a;
    box-shadow: 0 0 34px rgba(255,225,77,0.95);
    animation: none;
    transform: scale(0.94);
  }
  @keyframes item-pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(255,225,77,0.45); }
    50% { box-shadow: 0 0 28px rgba(255,225,77,0.85); }
  }

  /* ---------- face buttons (ACCEL / BRAKE) ---------- */
  #faces {
    flex: 1;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 24px 34px;
  }
  .face-btn {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    border: 3px solid;
    background: var(--panel);
    transition: transform 0.05s, box-shadow 0.1s, background 0.1s;
  }
  .face-btn:active, .face-btn.active { transform: scale(0.94); }

  #btn-brake {
    color: var(--neon-magenta);
    border-color: var(--neon-magenta);
    box-shadow: 0 0 10px rgba(255,62,200,0.25);
  }
  #btn-brake.active {
    background: var(--neon-magenta); color: #10152a;
    box-shadow: 0 0 30px rgba(255,62,200,0.8);
  }

  #btn-accel {
    color: var(--neon-green);
    border-color: var(--neon-green);
    box-shadow: 0 0 10px rgba(77,255,143,0.25);
  }
  #btn-accel.active {
    background: var(--neon-green); color: #10152a;
    box-shadow: 0 0 30px rgba(77,255,143,0.8);
  }
</style>
</head>
<body>
  <div id="topbar">
    <div id="logo">DS<span>64</span></div>
    <div><span id="status-dot"></span><span id="status">offline</span></div>
  </div>

  <div id="connect">
    <div id="connect-brand">DS<span>64</span></div>
    <div id="connect-label">Controller server address</div>
    <input id="addr" placeholder="ws://192.168.1.10:8765/player2" />
    <button id="go">Connect</button>
    <div id="connect-status"></div>
  </div>

  <div id="mode-select">
    <div id="mode-label">CHOOSE YOUR<br/>STEERING STYLE</div>
    <div class="mode-btn" id="mode-wheel">WHEEL<span class="mode-desc">drag your thumb left/right on the wheel</span></div>
    <div class="mode-btn" id="mode-buttons">BUTTONS<span class="mode-desc">tap and hold L / R arrows, full lock</span></div>
    <div class="mode-btn" id="mode-gyro">GYROSCOPE<span class="mode-desc">tilt the phone like a steering wheel</span></div>
  </div>
  <div id="gear-btn">&#9881;</div>
  <div id="settings-panel">
    <div class="settings-row">
      <label>Control method</label>
      <select id="method-select">
        <option value="wheel">Wheel (drag)</option>
        <option value="buttons">Buttons (L/R)</option>
        <option value="gyro">Gyroscope (tilt)</option>
      </select>
    </div>
    <div class="settings-row">
      <label>Steering sensitivity</label>
      <select id="sens-select">
        <option value="low">Low</option>
        <option value="normal" selected>Normal</option>
        <option value="high">High</option>
      </select>
    </div>
    <div id="full-picker-btn">&#8630; FULL MODE SCREEN</div>
  </div>

  <div id="pad">
    <div id="wheel-zone">
      <div id="wheel-row">
        <div class="steer-btn" id="btn-left">&#9664;</div>
        <div id="wheel">
          <div id="wheel-needle"></div>
          <div id="wheel-dot"></div>
        </div>
        <div class="steer-btn" id="btn-right">&#9654;</div>
      </div>
      <div id="tilt-readout">TILT 0.0&deg;</div>
    </div>

    <div id="shoulders">
      <div class="shoulder" id="sh-drift">R &middot; DRIFT</div>
      <div class="shoulder" id="sh-item"><div class="item-icon">&#127873;</div>L &middot; ITEM</div>
    </div>

    <div id="faces">
      <div class="face-btn" id="btn-brake">BRAKE</div>
      <div class="face-btn" id="btn-accel">ACCEL</div>
    </div>
  </div>

<script>
let ws = null;
let steer = 0;
const state = { accel: false, brake: false, drift: false, item: false };

function send() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ steer, accel: state.accel, brake: state.brake, drift: state.drift, item: state.item }));
}

function bindHold(id, key) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); state[key] = true; el.classList.add('active'); send(); };
  const off = (e) => { e.preventDefault(); state[key] = false; el.classList.remove('active'); send(); };
  el.addEventListener('touchstart', on);
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
}

bindHold('btn-accel', 'accel');
bindHold('btn-brake', 'brake');
bindHold('sh-drift', 'drift');
bindHold('sh-item', 'item');
setupWheelDrag();
setupSteerButtons();

let steerMode = null; // 'wheel' | 'buttons' | 'gyro'
let gyroListening = false;
const SENSITIVITY_LEVELS = { low: 0.6, normal: 1.0, high: 1.6 };
let sensitivity = 1.0;

// Only the chosen mode's input actually drives `steer` — see the
// #pad.mode-* display:none rules, which hide the other two controls
// entirely. setupWheelDrag()/setupSteerButtons() above always attach
// their listeners, but those listeners only fire on elements that are
// actually visible/touchable, so a hidden wheel or hidden L/R buttons
// simply never receive touch events in the first place.
async function activateMode(mode) {
  steerMode = mode;
  document.getElementById('method-select').value = mode;

  document.getElementById('pad').classList.remove('mode-wheel', 'mode-buttons', 'mode-gyro');
  document.getElementById('pad').classList.add('mode-' + mode);

  if (mode === 'gyro' && !gyroListening) {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          gyroListening = true;
        } else {
          document.getElementById('tilt-readout').textContent = 'motion permission denied';
        }
      } catch (err) {
        document.getElementById('tilt-readout').textContent = 'motion permission unavailable';
      }
    } else {
      // Android/desktop: no explicit permission API, just listen.
      window.addEventListener('deviceorientation', handleOrientation);
      gyroListening = true;
    }
  }

  applySteer(0);
  document.getElementById('mode-select').style.display = 'none';
  document.getElementById('pad').style.display = 'flex';
}

document.getElementById('mode-wheel').addEventListener('click', () => activateMode('wheel'));
document.getElementById('mode-buttons').addEventListener('click', () => activateMode('buttons'));
document.getElementById('mode-gyro').addEventListener('click', () => activateMode('gyro'));

function goToOnboarding() {
  applySteer(0);
  document.getElementById('settings-panel').style.display = 'none';
  document.getElementById('pad').style.display = 'none';
  document.getElementById('mode-select').style.display = 'flex';
}

// Settings gear: quick dropdowns for method + sensitivity without
// leaving the pad, plus a button back to the full first-run picker.
document.getElementById('gear-btn').addEventListener('click', () => {
  const panel = document.getElementById('settings-panel');
  panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
});
document.getElementById('method-select').addEventListener('change', (e) => {
  activateMode(e.target.value);
});
document.getElementById('sens-select').addEventListener('change', (e) => {
  sensitivity = SENSITIVITY_LEVELS[e.target.value] ?? 1.0;
});
document.getElementById('full-picker-btn').addEventListener('click', goToOnboarding);

function applySteer(value) {
  steer = Math.max(-1, Math.min(1, value));
  const wheel = document.getElementById('wheel');
  const needle = document.getElementById('wheel-needle');
  const angle = steer * 55; // visual max rotation
  needle.style.transform = `rotate(${angle}deg)`;
  wheel.classList.toggle('turning', Math.abs(steer) > 0.08);
  send();
}

function handleOrientation(e) {
  const gamma = e.gamma || 0;
  applySteer((gamma / 30) * sensitivity);
  document.getElementById('tilt-readout').textContent = 'TILT ' + gamma.toFixed(1) + '°';
}

// Primary steering input: drag the wheel left/right with your thumb.
// Doesn't depend on any motion-sensor permission (which is flaky across
// browsers/OSes and often blocked entirely over plain http://), so this
// always works regardless of what deviceorientation ends up doing.
function setupWheelDrag() {
  const wheel = document.getElementById('wheel');
  let dragging = false;

  const posX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);

  const start = (e) => { e.preventDefault(); dragging = true; move(e); };
  const move = (e) => {
    if (!dragging) return;
    e.preventDefault();
    const rect = wheel.getBoundingClientRect();
    const center = rect.left + rect.width / 2;
    const dx = posX(e) - center;
    applySteer((dx / (rect.width / 2)) * sensitivity);
    document.getElementById('tilt-readout').textContent = 'DRAG ' + steer.toFixed(2);
  };
  const end = (e) => {
    if (!dragging) return;
    e.preventDefault();
    dragging = false;
    applySteer(0);
    document.getElementById('tilt-readout').textContent = 'DRAG 0.00';
  };

  wheel.addEventListener('touchstart', start);
  wheel.addEventListener('touchmove', move);
  wheel.addEventListener('touchend', end);
  wheel.addEventListener('touchcancel', end);
  wheel.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
}

// Digital L/R alternative to dragging the wheel — full-lock steer while
// held, centered on release. Simpler and more reliable than tracking a
// thumb drag or depending on tilt/motion permissions.
function setupSteerButtons() {
  function bind(id, dir) {
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); el.classList.add('active'); applySteer(dir); };
    const off = (e) => {
      e.preventDefault();
      el.classList.remove('active');
      applySteer(0);
      document.getElementById('tilt-readout').textContent = 'DRAG 0.00';
    };
    el.addEventListener('touchstart', on);
    el.addEventListener('touchend', off);
    el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
  }
  bind('btn-left', -1);
  bind('btn-right', 1);
}

// A QR code encodes this page's URL with ?ws=<address> baked in, so
// scanning it skips typing the address entirely — just one tap to grant
// motion access (iOS requires that tap to come from the user, so true
// zero-tap auto-connect isn't possible, but this is as close as it gets.
const qsAddr = new URLSearchParams(location.search).get('ws');
if (qsAddr) {
  document.getElementById('addr').value = qsAddr;
  document.getElementById('addr').style.display = 'none';
  document.getElementById('connect-label').style.display = 'none';
  document.getElementById('go').textContent = 'TAP TO START';
}

function setConnectStatus(msg, isError) {
  const el = document.getElementById('connect-status');
  el.textContent = msg;
  el.classList.toggle('err', !!isError);
}

document.getElementById('go').addEventListener('click', async () => {
  const addr = document.getElementById('addr').value.trim();
  if (!addr) {
    setConnectStatus('no server address set', true);
    return;
  }

  setConnectStatus('connecting to ' + addr + ' …');

  ws = new WebSocket(addr);

  const connectTimeout = setTimeout(() => {
    setConnectStatus('timed out — is play.sh running on the host?', true);
    ws.close();
  }, 6000);

  ws.onopen = () => {
    clearTimeout(connectTimeout);
    document.getElementById('status').textContent = 'connected';
    document.getElementById('status-dot').classList.add('live');
    document.getElementById('connect').style.display = 'none';
    document.getElementById('gear-btn').style.display = 'flex';
    setInterval(send, 50);

    // Steering style is never remembered across connects — always ask,
    // every time, so a shared device never silently keeps a previous
    // player's choice.
    document.getElementById('mode-select').style.display = 'flex';
  };
  ws.onclose = (ev) => {
    clearTimeout(connectTimeout);
    document.getElementById('status').textContent = 'disconnected';
    document.getElementById('status-dot').classList.remove('live');
    document.getElementById('pad').style.display = 'none';
    document.getElementById('mode-select').style.display = 'none';
    document.getElementById('gear-btn').style.display = 'none';
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('connect').style.display = 'flex';
    // 4001 = phone_bridge.SLOT_TAKEN_CODE: another phone already drives
    // this player (e.g. this phone scanned someone else's QR code).
    if (ev.code === 4001) {
      setConnectStatus('this player is already taken — scan your own QR code', true);
    } else {
      setConnectStatus('disconnected — tap to retry', true);
    }
  };
  ws.onerror = () => {
    setConnectStatus('connection failed — check host is on the same Wi-Fi', true);
  };
});
</script>
</body>
</html>
